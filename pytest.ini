[pytest]
asyncio_mode = auto
markers =
    integration: hits the live Gemini API (requires ADC, costs money)
    loadtest: sustained load benchmark against the live Gemini API (requires ADC, up to $1.50 per run)
    benchmark: production-rate load tiers against the live Gemini API (requires ADC, budgets sum $3.25 for the full sweep)
addopts = -m "not integration and not loadtest and not benchmark"
